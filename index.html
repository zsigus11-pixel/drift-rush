<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DRIFT RUSH</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="menu" class="screen">
  <div class="scan"></div>
  <div class="brand">DRIFT <span>RUSH</span></div>
  <div class="tag">NEON STREET DRIFT</div>
  <button id="start">JÁTÉK INDÍTÁSA</button>
  <button id="tracks">PÁLYAVÁLASZTÁS</button>
  <button id="settings">BEÁLLÍTÁSOK</button>
  <div id="trackPanel" class="panel hidden">
    <h2>PÁLYA</h2>
    <button data-track="city">NEON CITY</button>
    <button data-track="industrial">INDUSTRIAL DOCKS</button>
    <button data-track="race">NIGHT CIRCUIT</button>
    <button id="closeTracks">VISSZA</button>
  </div>
  <div id="settingsPanel" class="panel hidden">
    <h2>BEÁLLÍTÁSOK</h2>
    <label>Hang <input id="sound" type="range" min="0" max="1" step=".05" value=".7"></label>
    <label>Effektek <input id="fx" type="range" min=".2" max="1.4" step=".05" value="1"></label>
    <button id="closeSettings">VISSZA</button>
  </div>
</div>

<div id="hud" class="hud hidden">
  <div><small>SEBESSÉG</small><b id="speed">0</b><span> KM/H</span></div>
  <div><small>DRIFT</small><b id="drift">0</b></div>
  <div><small>COMBO</small><b id="combo">x1</b></div>
  <div class="trackName" id="trackName">NEON CITY</div>
  <button id="quit">MENÜ</button>
</div>

<div id="touch" class="touch hidden">
  <button data-key="ArrowLeft">◀</button><button data-key="ArrowUp">▲</button>
  <button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button>
  <button data-key="Space" class="handbrake">DRIFT</button>
</div>

<script src="game.js"></script>
</body>
</html>
